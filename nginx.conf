server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Arquivos gerados pelo Vite têm hash no nome: cache longo.
  # Se não existir, 404 de verdade (nunca devolve o index.html no lugar de um .js).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html sempre atualizado após um deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Rotas do React Router (/equipe-03, /equipe-03/sobre...) caem no app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
